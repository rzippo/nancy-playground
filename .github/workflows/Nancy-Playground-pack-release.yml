name: Nancy-Playground-pack-release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Nancy-Playground/Nancy-Playground/Nancy-Playground.csproj"

jobs:
  Nancy-Playground-pack-release:
    # a pull request, or a manual run on another branch, must not publish: this allows dispatching
    # from a release tag too, but the ancestry check below still enforces that only a commit that is
    # actually on master gets released, regardless of what a tag is named or where it points
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIG: "Release"
      SOLUTION: "Nancy-Playground/Nancy-Playground.sln"
      NANCY_PLAYGROUND: "Nancy-Playground/Nancy-Playground/Nancy-Playground.csproj"
      NANCY_PLAYGROUND_TESTS: "Nancy-Playground/Nancy-Playground.Tests/Nancy-Playground.Tests.csproj"
      MPPG_PARSER_TESTS: "Nancy-Playground/MppgParser.Tests/MppgParser.Tests.csproj"
      NANCY_PLAYGROUND_PACKS: "Nancy-Playground/Nancy-Playground/nupkg/*.nupkg"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to release a commit that is not on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor ${{ github.sha }} origin/master || {
            echo "::error::${{ github.sha }} is not an ancestor of master; refusing to release."
            exit 1
          }

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build Nancy-Playground
        run: dotnet build $NANCY_PLAYGROUND --configuration $BUILD_CONFIG

      - name: Build MppgParser.Tests
        run: dotnet build $MPPG_PARSER_TESTS --configuration $BUILD_CONFIG

      - name: Build Nancy-Playground.Tests
        run: dotnet build $NANCY_PLAYGROUND_TESTS --configuration $BUILD_CONFIG

      - name: Test MppgParser
        run: dotnet test --project $MPPG_PARSER_TESTS --configuration $BUILD_CONFIG -- --stop-on-fail on

      - name: Test Nancy-Playground
        run: dotnet test --project $NANCY_PLAYGROUND_TESTS --configuration $BUILD_CONFIG -- --stop-on-fail on

      - name: Pack
        run: dotnet pack $NANCY_PLAYGROUND --configuration $BUILD_CONFIG --no-restore --no-build

      - name: Publish
        run: dotnet nuget push $NANCY_PLAYGROUND_PACKS --source 'https://api.nuget.org/v3/index.json' --api-key ${{secrets.NUGET_API_KEY}}
